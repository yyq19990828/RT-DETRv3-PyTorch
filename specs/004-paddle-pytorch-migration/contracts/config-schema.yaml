#------------------------------------------------------------------------------
# MIGRATION FROM PADDLEPADDLE CONFIGS
#------------------------------------------------------------------------------

# PaddlePaddle vs PyTorch config differences:
#
# 1. IDENTICAL:
#    - Structure (nested dicts with 'type' keys)
#    - Parameter names (snake_case)
#    - Shared config mechanism
#
# 2. DIFFERENT:
#    - Import paths: ppdet.modeling → rtdetrv3_pytorch.models
#    - Some parameter names may differ (check API docs)
#
# 3. CONVERSION TIPS:
#    - Replace PaddlePaddle type names with PyTorch equivalents
#      (usually same class name, different module path)
#    - Check for renamed parameters (e.g., 'num_classes' vs 'num_class')
#    - Verify default values match (may differ between frameworks)

#------------------------------------------------------------------------------
# ERROR HANDLING
#------------------------------------------------------------------------------

# Common config errors and how to fix:

# ERROR: "Config must contain 'type' key"
# FIX: Add 'type: <ClassName>' to component config

# ERROR: "backbone 'ResNet' not found in registry"
# FIX: Ensure component is registered and imported
#      (check rtdetrv3_pytorch/models/backbones/__init__.py)

# ERROR: "Dependency 'UnknownComponent' not found"
# FIX: Check nested component 'type' values match registered names

# ERROR: "TypeError: __init__() got unexpected keyword argument 'foo'"
# FIX: Remove 'foo' from config or add parameter to __init__

