[project]
name = "rtdetrv3-pytorch"
version = "0.1.0"
description = "RT-DETRv3 PyTorch Implementation - Migrated from PaddlePaddle"
readme = "README.md"
authors = [
    { name = "yiqing.yang", email = "yiqing.yang@tyjt-ai.com" }
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "numpy<2.0",  # Changed to match Paddle requirement
    "opencv-python<=4.6.0",  # Match Paddle requirement for compatibility
    "pycocotools>=2.0.7",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "paddlepaddle",
    "tqdm>=4.65.0",
    "pillow>=9.0.0",
    "gdown>=5.2.0",
    # Additional Paddle dependencies
    "typeguard>=4.0.0",
    "visualdl>=2.2.0",
    "shapely>=2.0.0",
    "terminaltables>=3.1.0",
    "cython>=0.29.0",
    "setuptools>=65.0.0",
    # For MOT evaluation and inference
    "lapx>=0.5.0",
    "motmetrics>=1.4.0",
    "scikit-learn>=1.0.0",  # sklearn==0.0 is a meta-package, use scikit-learn instead
    # For vehicleplate in deploy/pipeline
    "pyclipper>=1.3.0",
    # For CULane data augmentation
    "imgaug>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "engine", "models", "utils", "configs", "tools"]

[tool.uv]
# Default index configuration
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://mirror.nju.edu.cn/pytorch/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "paddlepaddle-nightly"
url = "https://www.paddlepaddle.org.cn/packages/nightly/cpu/"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
paddlepaddle = { index = "paddlepaddle-nightly" }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "numerical: marks tests as numerical equivalence tests",
]
