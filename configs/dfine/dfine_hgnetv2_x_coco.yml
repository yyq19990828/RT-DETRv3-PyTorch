_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  '_base_/reader.yml',
  '_base_/optimizer.yml',
  '_base_/dfine_hgnetv2.yml',
]

save_dir: output/dfine_hgnetv2_x_coco
ema_restart_decay: 0.9998

TrainingProtocol:
  name: TwoStageDetectionProtocol
  family: dfine
  stop_epoch: 72
  ema_restart_decay: 0.9998

HGNetv2:
  name: B5

DFINEHybridEncoder:
  hidden_dim: 384
  dim_feedforward: 2048

DFINETransformer:
  feat_channels: [384, 384, 384]
  reg_scale: 8.0

OptimizerBuilder:
  optimizer:
    param_groups:
      - params: ['^backbone\.(?!.*(?:norm|bn)).*$']
        lr: 0.0000025
      - params: ['^(?:encoder|decoder)\..*(?:norm|bn).*$']
        weight_decay: 0.0

TrainReader:
  batch_transforms:
    - BatchRandomResize: {target_size: [480, 512, 544, 576, 608, 640, 640, 640, 672, 704, 736, 768, 800], random_size: true, random_interp: false, keep_ratio: false}
    - NormalizeImage: {mean: [0.0, 0.0, 0.0], std: [1.0, 1.0, 1.0], is_scale: true}
    - NormalizeBox: {}
    - BboxXYXY2XYWH: {}
    - Permute: {}
