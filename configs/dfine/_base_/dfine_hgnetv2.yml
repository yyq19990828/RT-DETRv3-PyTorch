architecture: DFINE
validate: true
num_classes: 80
use_focal_loss: true
eval_spatial_size: [640, 640]

DFINE:
  backbone: HGNetv2
  encoder: DFINEHybridEncoder
  decoder: DFINETransformer
  criterion: DFINECriterion
  post_process: DETRPostProcess

HGNetv2:
  name: B4
  return_idx: [1, 2, 3]
  freeze_stem_only: true
  freeze_at: 0
  freeze_norm: true

DFINEHybridEncoder:
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 1.0
  depth_mult: 1.0
  act: silu

DFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 6
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default

DFINECriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: [vfl, boxes, local]
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  matcher:
    name: DFINEHungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

DETRPostProcess:
  num_top_queries: 300
