worker_num: 4

TrainReader:
  name: TrainReader
  sample_transforms:
    - Decode: {}
    - RandomDistort: {prob: 0.5}
    - RandomExpand: {fill_value: [0, 0, 0]}
    - RandomCrop: {prob: 0.8}
    - RandomFlip: {}
  batch_transforms:
    - BatchRandomResize: {target_size: [480, 512, 544, 576, 608, 640, 640, 640, 640, 672, 704, 736, 768, 800], random_size: true, random_interp: false, keep_ratio: false}
    - NormalizeImage: {mean: [0.0, 0.0, 0.0], std: [1.0, 1.0, 1.0], is_scale: true}
    - NormalizeBox: {}
    - BboxXYXY2XYWH: {}
    - Permute: {}
  ordinary_transform_policy:
    stop_epoch: 72
    ops: [RandomDistort, RandomExpand, RandomCrop]
    base_size: 640
  total_batch_size: 32
  shuffle: true
  drop_last: true
  collate_batch: false
  use_shared_memory: true

EvalReader:
  name: EvalReader
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: false, backend: pil}
    - NormalizeImage: {mean: [0.0, 0.0, 0.0], std: [1.0, 1.0, 1.0], is_scale: true}
    - Permute: {}
  total_batch_size: 64
  shuffle: false
  drop_last: false

TestReader:
  name: TestReader
  inputs_def:
    image_shape: [3, 640, 640]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: false, backend: pil}
    - NormalizeImage: {mean: [0.0, 0.0, 0.0], std: [1.0, 1.0, 1.0], is_scale: true}
    - Permute: {}
  batch_size: 1
  shuffle: false
  drop_last: false
