architecture: RTDETRV4

RTDETRV4:
  backbone: HGNetv2
  encoder: DFINEHybridEncoder
  decoder: DFINETransformer
  criterion: RTDETRV4Criterion
  post_process: DETRPostProcess

DFINEHybridEncoder:
  distill_teacher_dim: 768
  project_f5: true

RTDETRV4Criterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5, loss_distill: 10}
  losses: [mal, boxes, local, distill]
  alpha: 0.2
  gamma: 1.5
  reg_max: 32
  use_uni_set: true
  matcher:
    name: DFINEHungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

teacher_model:
  type: DINOv3TeacherModel
  dinov3_repo_path: /path/to/dinov3
  dinov3_weights_path: /path/to/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  weights_filename: dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  weights_size_bytes: 342860279
  weights_sha256: 73cec8be7427c8655ceced13ce62f6e20a1fa90d1b4d4a550df17a1144081a7c
  dinov3_model_type: dinov3_vitb16
  patch_size: 16
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
