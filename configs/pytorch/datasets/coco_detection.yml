# PyTorch version - Dataset configuration
metric: COCO
num_classes: 80

TrainDataset:
  name: COCODataSet  # PyTorch: data.coco_dataset.COCODetection
  image_dir: train2017
  anno_path: annotations/instances_train2017.json
  dataset_dir: data/coco  # PyTorch: Use local data path
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

EvalDataset:
  name: COCODataSet  # PyTorch: data.coco_dataset.COCODetection
  image_dir: val2017
  anno_path: annotations/instances_val2017.json
  dataset_dir: data/coco  # PyTorch: Use local data path
  allow_empty: true

TestDataset:
  name: ImageFolder
  anno_path: annotations/instances_val2017.json
  dataset_dir: data/coco
