# PyTorch version - removed YAML tags and adapted to PyTorch naming
epoch: 72

LearningRate:
  base_lr: 0.0001  # Adjusted from 0.0004
  schedulers:
  - name: PiecewiseDecay  # PyTorch: torch.optim.lr_scheduler.MultiStepLR
    gamma: 0.1  # Changed from 1.0
    milestones: [60]  # Changed from [100]
    use_warmup: true
  - name: LinearWarmup  # PyTorch: torch.optim.lr_scheduler.LinearLR
    start_factor: 0.001
    steps: 1000  # Changed from 2000

OptimizerBuilder:
  clip_grad_by_norm: 0.1  # PyTorch: torch.nn.utils.clip_grad_norm_
  regularizer: false
  optimizer:
    type: AdamW  # PyTorch: torch.optim.AdamW
    weight_decay: 0.0001
