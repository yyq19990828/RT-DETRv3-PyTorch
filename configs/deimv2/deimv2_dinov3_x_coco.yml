_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  '_base_/deimv2.yml',
]

save_dir: output/deimv2_dinov3_x_coco
epoch: 72
base_lr: 0.0005
ema_restart_decay: 0.9999

DEIMV2:
  backbone: DINOv3STAs

DINOv3STAs:
  name: dinov3_vits16plus
  weights_path: null
  interaction_indexes: [5, 8, 11]
  finetune: true
  conv_inplane: 64
  hidden_dim: 256

DFINEHybridEncoder:
  in_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 1024
  expansion: 1.25
  depth_mult: 1.37

DEIMTransformer:
  feat_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 2048

TrainingProtocol:
  name: TwoStageDetectionProtocol
  family: deimv2
  stop_epoch: 50
  ema_restart_decay: 0.9999

LearningRate:
  base_lr: 0.0005
  schedulers:
    - name: FlatCosineLRScheduler
      total_epochs: 72
      warmup_iter: 2000
      flat_epochs: 29
      no_aug_epochs: 8
      lr_gamma: 0.5

OptimizerBuilder:
  clip_grad_by_norm: 0.1
  regularizer: false
  optimizer:
    type: AdamW
    betas: [0.9, 0.999]
    weight_decay: 0.000125
    param_groups:
      - params: ['^(?=.*backbone.dinov3)(?!.*(?:norm|bn|bias)).*$']
        lr: 0.00001
      - params: ['^(?=.*backbone.dinov3)(?=.*(?:norm|bn|bias)).*$']
        lr: 0.00001
        weight_decay: 0.0
      - params: ['^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$']
        weight_decay: 0.0

TrainReader:
  total_batch_size: 32
  batch_transforms:
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: true}
    - NormalizeBox: {}
    - BboxXYXY2XYWH: {}
    - Permute: {}
  dense_o2o_policy:
    policy_epochs: [4, 29, 50]
    mixup_epochs: [4, 29]
    multiscale_stop_epoch: 50
    copyblend_epochs: [4, 50]
    multiscale_sizes: [480, 512, 544, 576, 608, 640, 640, 640, 672, 704, 736, 768, 800]

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: false, backend: pil}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: true}
    - Permute: {}
  total_batch_size: 64

TestReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: false, backend: pil}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: true}
    - Permute: {}
