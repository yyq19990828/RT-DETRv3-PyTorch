[project]
name = "rtdetrv3-pytorch"
version = "0.1.0"
description = "PyTorch implementation and migration workspace for RT-DETRv3"
readme = "README.md"
authors = [
    { name = "yiqing.yang", email = "yiqing.yang@tyjt-ai.com" },
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.5.5",
    "pillow>=9.0",
    "pycocotools>=2.0.7",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "shapely>=2.0",
    "terminaltables>=3.1",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "cython>=0.29",
    "gdown>=5.0",
    "imgaug>=0.4",
    "lapx>=0.5",
    "motmetrics>=1.4",
    "mypy>=1.0",
    "numpy<2",
    "opencv-python<=4.6.0",
    "paddlepaddle>=3.0",
    "pyclipper>=1.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "scikit-learn>=1.0",
    "setuptools>=65.0",
    "typeguard>=4.0",
    "visualdl>=2.2",
]

[project.scripts]
rtdetrv3-convert = "ppdet_pytorch.cli.convert:main"
rtdetrv3-eval = "ppdet_pytorch.cli.eval:main"
rtdetrv3-infer = "ppdet_pytorch.cli.infer:main"
rtdetrv3-train = "ppdet_pytorch.cli.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppdet_pytorch"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://mirror.nju.edu.cn/pytorch/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "paddlepaddle-nightly"
url = "https://www.paddlepaddle.org.cn/packages/nightly/cpu/"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddlepaddle-nightly" }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
norecursedirs = ["legacy"]
markers = [
    "integration: marks integration tests",
    "numerical: marks numerical-equivalence tests",
    "paddle: requires the PaddlePaddle development extra",
    "slow: marks slow tests (deselect with '-m not slow')",
    "unit: marks unit tests",
]

[tool.black]
line-length = 88
target-version = ["py39"]
