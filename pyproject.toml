[project]
name = "rtdetrv3-pytorch"
version = "0.1.0"
description = "Unified PyTorch implementations and validation workspace for DETR models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["object-detection", "pytorch", "rt-detr", "rtdetrv3"]
authors = [
    { name = "yiqing.yang", email = "yiqing.yang@tyjt-ai.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.5.5",
    "pillow>=9.0",
    "pycocotools>=2.0.7",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "shapely>=2.0",
    "terminaltables>=3.1",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "cython>=0.29",
    "gdown>=5.0",
    "imgaug>=0.4",
    "lapx>=0.5",
    "motmetrics>=1.4",
    "mypy>=1.0",
    "numpy<2",
    "opencv-python<=4.6.0",
    "onnx>=1.16",
    "onnxruntime-gpu>=1.19,<1.20; python_version < '3.10'",
    "onnxruntime-gpu>=1.19,<1.24; python_version >= '3.10' and python_version < '3.11'",
    "onnxruntime-gpu>=1.19,<1.27; python_version >= '3.11'",
    "paddlepaddle-gpu==3.3.0",
    "pyclipper>=1.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "scikit-learn>=1.0",
    "setuptools>=65.0",
    "typeguard>=4.0",
    "types-PyYAML>=6.0",
    "visualdl>=2.2",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.18,<1.20; python_version < '3.10'",
    "onnxruntime>=1.18,<1.24; python_version >= '3.10' and python_version < '3.11'",
    "onnxruntime>=1.18; python_version >= '3.11'",
]
export-gpu = [
    "onnx>=1.16",
    "onnxruntime-gpu>=1.19,<1.20; python_version < '3.10'",
    "onnxruntime-gpu>=1.19,<1.24; python_version >= '3.10' and python_version < '3.11'",
    "onnxruntime-gpu>=1.19,<1.27; python_version >= '3.11'",
]
quality = [
    "mypy>=1.0",
    "ruff>=0.15",
    "types-PyYAML>=6.0",
]
test = [
    "onnx>=1.16",
    "onnxruntime>=1.18,<1.20; python_version < '3.10'",
    "onnxruntime>=1.18,<1.24; python_version >= '3.10' and python_version < '3.11'",
    "onnxruntime>=1.18; python_version >= '3.11'",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "typeguard>=4.0",
]
teacher = [
    "ftfy",
    "omegaconf",
    "regex",
    "scikit-learn>=1.0",
    "submitit",
    "termcolor",
    "torchmetrics",
]

[project.scripts]
rtdetrv3-convert = "ppdet_pytorch.cli.convert:main"
rtdetrv3-eval = "ppdet_pytorch.cli.eval:main"
rtdetrv3-export = "ppdet_pytorch.cli.export:main"
rtdetrv3-infer = "ppdet_pytorch.cli.infer:main"
rtdetrv3-models = "ppdet_pytorch.cli.models:main"
rtdetrv3-train = "ppdet_pytorch.cli.train:main"

[project.urls]
Documentation = "https://github.com/yyq19990828/DETR-series/tree/main/docs"
Issues = "https://github.com/yyq19990828/DETR-series/issues"
Repository = "https://github.com/yyq19990828/DETR-series"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppdet_pytorch"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "ppdet_pytorch/configs"

[tool.hatch.build.targets.sdist]
only-include = [
    "configs",
    "scripts",
    "src",
    "tests",
    "LICENSE",
    "NOTICE",
    "README.md",
    "pyproject.toml",
    "uv.lock",
]

[tool.uv]
required-version = ">=0.11.29,<0.13"
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
index-url = "https://pypi.org/simple"
conflicts = [
    [
        { extra = "dev" },
        { extra = "export" },
    ],
    [
        { extra = "dev" },
        { extra = "test" },
    ],
    [
        { extra = "export-gpu" },
        { extra = "export" },
    ],
    [
        { extra = "export-gpu" },
        { extra = "test" },
    ],
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "paddlepaddle-cu118"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu118/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddlepaddle-cu118" }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
norecursedirs = ["legacy"]
markers = [
    "integration: marks integration tests",
    "numerical: marks numerical-equivalence tests",
    "paddle: requires the PaddlePaddle development extra",
    "slow: marks slow tests (deselect with '-m not slow')",
    "unit: marks unit tests",
]

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = [
    "output",
    "pretrained_models",
    "tests/legacy",
    "third-party",
    # Vendored (trimmed) Meta DINOv3 forward code kept verbatim for
    # provenance; only style rules are skipped, not correctness gates.
    "src/ppdet_pytorch/modeling/backbones/dinov3",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"src/ppdet_pytorch/cli/train.py" = ["E402"]
"tools/dev/check_model_consistency.py" = ["E402"]
"tools/dev/verify_model_size.py" = ["E402"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
ignore_missing_imports = true
exclude = "src/ppdet_pytorch/modeling/backbones/dinov3/"
