name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true

      - name: Install quality dependencies
        run: uv sync --locked --extra quality

      - name: Run quality gate
        run: uv run --no-sync python scripts/check_quality.py

      - name: Check repository documentation
        run: uv run --no-sync python scripts/check_docs.py

  cpu-tests:
    name: CPU / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install core test dependencies
        run: uv sync --locked --extra test

      - name: Confirm CPU execution
        run: uv run --no-sync python -c "import torch; assert not torch.cuda.is_available()"

      - name: Run non-Paddle tests
        if: matrix.python-version != '3.12'
        run: uv run --no-sync pytest -p no:cacheprovider -q -m "not paddle"

      - name: Run non-Paddle tests with coverage gate
        if: matrix.python-version == '3.12'
        run: uv run --no-sync python scripts/check_coverage.py

  wheel-smoke:
    name: Wheel smoke / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked test environment
        run: uv sync --locked --extra test

      - name: Build wheel and source distribution
        run: uv build

      - name: Validate release artifacts
        run: >-
          uv run --no-sync python scripts/check_release.py
          --wheel dist/*.whl
          --sdist dist/*.tar.gz

      - name: Install wheel over editable package
        run: uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl

      - name: Verify console entry points
        run: |
          scratch_dir="$(mktemp -d)"
          trap 'rm -rf "$scratch_dir"' EXIT
          cd "$scratch_dir"
          "$GITHUB_WORKSPACE/.venv/bin/detrs" --help
          for command in train eval infer export convert models; do
            "$GITHUB_WORKSPACE/.venv/bin/detrs" "$command" --help
          done

      - name: Verify packaged config outside checkout
        run: |
          venv_python="$PWD/.venv/bin/python"
          scratch_dir="$(mktemp -d)"
          trap 'rm -rf "$scratch_dir"' EXIT
          cd "$scratch_dir"
          "$venv_python" -c "from detrs import modeling; from detrs.core.workspace import load_config; paths = ['configs/dfine/dfine_hgnetv2_n_coco.yml', 'configs/deim/dfine/deim_hgnetv2_n_coco.yml', 'configs/deim/rtdetrv2/deim_r18vd_120e_coco.yml', 'configs/rtdetrv4/rtdetrv4_hgnetv2_s_coco.yml']; assert all(load_config(path).architecture for path in paths)"

      - name: Run wheel CLI and export smoke tests
        run: >-
          uv run --no-sync pytest -p no:cacheprovider -q
          tests/unit/cli/test_eval.py
          tests/unit/cli/test_infer.py
          tests/unit/cli/test_export.py
          tests/unit/deploy/test_export.py
          tests/unit/deploy/test_model_family_matrix.py
          tests/integration/test_packaged_model_families.py
